<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Icono: un ticket con el borde inferior troquelado — el mismo recurso que
    separa las líneas de los totales dentro de la aplicación.
    Se dibuja con formas grandes y solo cuatro líneas porque a 32 px, que es el
    tamaño de la barra de tareas, cualquier detalle fino desaparece.
  -->
  <rect width="1024" height="1024" rx="228" fill="#1C1917"/>

  <!-- Papel: rectángulo con seis dientes de corte abajo -->
  <path
    fill="#FAF7F2"
    d="M272,232 H752 V700
       l-40,50 l-40,-50 l-40,50 l-40,-50 l-40,50 l-40,-50
       l-40,50 l-40,-50 l-40,50 l-40,-50 l-40,50 l-40,-50
       Z"/>

  <!-- Conceptos -->
  <g fill="#B4ADA6">
    <rect x="336" y="330" width="352" height="34" rx="17"/>
    <rect x="336" y="418" width="268" height="34" rx="17"/>
    <rect x="336" y="506" width="310" height="34" rx="17"/>
  </g>

  <!-- Total: más grueso y en el ámbar de la marca -->
  <rect x="336" y="596" width="352" height="52" rx="26" fill="#D97706"/>
</svg>
